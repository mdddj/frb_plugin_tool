[package]
name = "frb_plugin_tool_ohos"
version = "0.3.2"
edition = "2024"
authors = ["hlxsmail@gmail.com"]
license = "MIT OR Apache-2.0"
description = "dart rust frb 快速生成项目脚本"
readme = "README.md"
homepage = "https://github.com/mdddj/frb_plugin_tool"
repository = "https://github.com/mdddj/frb_plugin_tool"
keywords = ["dart", "plugin", "flutter", "frb", "rust"]
categories = ["command-line-utilities"]
include = ["/temp/**", "/src/**"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
duct = "1.0.0"
futures = "0.3.31"
reqwest = { version = "0.12.12" }
tera = "1.20.0"
tokio = { version = "1.44.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
walkdir = "2"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "1.0"
